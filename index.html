<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金小智｜金融AI助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f3f4f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #2563eb;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .msg {
            max-width: 75%;
            margin-bottom: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .user-msg {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }
        .bot-msg {
            background: #ffffff;
            color: #222;
            margin-right: auto;
            box-shadow: 0 1px 3px #00000018;
        }
        .input-area {
            display: flex;
            padding: 14px;
            background: #fff;
            gap:10px;
            border-top:1px solid #ddd;
        }
        #userInput {
            flex:1;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            font-size:15px;
        }
        #sendBtn {
            padding:0 20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
        #sendBtn:disabled{
            background:#94a3b8;
            cursor:not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">🤖 金小智 - 金融AI助手</div>
    <div class="chat-container" id="chatBox"></div>
    <div class="input-area">
        <input id="userInput" placeholder="输入你的金融问题..." type="text">
        <button id="sendBtn">发送</button>
    </div>

<script>
const BACKEND_URL = "https://liwanning-nk-finance-study-backend.hf.space/";
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

// 添加消息到页面
function addMessage(text, isUser){
    const div = document.createElement('div');
    div.className = "msg " + (isUser ? "user-msg" : "bot-msg");
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

async function sendMessage(){
    const question = userInput.value.trim();
    if(!question) return;
    addMessage(question, true);
    userInput.value = "";
    sendBtn.disabled = true;

    // 占位
    const botDom = addMessage("思考中...", false);
    try{
        // 接口示例：POST /chat，body {query:"xxx"}
        const res = await fetch(`${BACKEND_URL}chat`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({query: question})
        })
        if(!res.ok) throw new Error("后端异常");
        const data = await res.json();
        botDom.innerText = data.answer || data;
    }catch(err){
        botDom.innerText = "出错啦：" + err.message;
        console.error(err);
    }
    sendBtn.disabled = false;
}

sendBtn.onclick = sendMessage;
userInput.onkeydown = (e)=>{
    if(e.key === "Enter") sendMessage();
}
</script>
</body>
</html>
