<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>情绪蜡烛图监测系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body{margin:0;padding:20px;background:#f7f9fc;font-family:system-ui}
        .container{max-width:1200px;margin:0 auto}
        .title{text-align:center;font-size:24px;margin-bottom:20px;color:#2c3e50}
        #chart{width:100%;height:650px;background:#fff;border-radius:12px;box-shadow:0 2px 12px #0000001a;margin-bottom:20px}
        .input-box{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 12px #0000001a;margin-bottom:16px}
        .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
        label{width:90px}
        input{padding:8px;flex:1;min-width:120px}
        button{padding:9px 16px;border:none;border-radius:6px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
        button.del{background:#dc2626}
        .list-title{margin-top:10px;font-weight:bold}
        #dataList{max-height:180px;overflow-y:auto;border:1px solid #eee;padding:8px;border-radius:6px}
        .item{padding:4px 0;border-bottom:1px solid #f1f1f1;display:flex;justify-content:space-between}
    </style>
</head>
<body>
<div class="container">
    <div class="title">情绪蜡烛图监测系统｜历史K线 + LSTM预测</div>
    <div id="chart"></div>

    <div class="input-box">
        <div class="row">
            <label>日期</label>
            <input type="date" id="inDate">
            <label>开盘情绪(Open)</label>
            <input type="number" min="0" max="10" step="0.1" id="inOpen">
        </div>
        <div class="row">
            <label>最高情绪(High)</label>
            <input type="number" min="0" max="10" step="0.1" id="inHigh">
            <label>最低情绪(Low)</label>
            <input type="number" min="0" max="10" step="0.1" id="inLow">
            <label>收盘情绪(Close)</label>
            <input type="number" min="0" max="10" step="0.1" id="inClose">
        </div>
        <div class="row">
            <button id="btnAdd">添加这条情绪记录</button>
            <button id="btnClear">清空全部数据</button>
            <button id="btnRender">刷新图表</button>
        </div>
        <div class="list-title">已录入数据列表</div>
        <div id="dataList"></div>
    </div>
</div>

<script>
const myChart = echarts.init(document.getElementById('chart'));
const STORAGE_KEY = "emotion_records";

// 读取本地存储
function loadLocal(){
    const str = localStorage.getItem(STORAGE_KEY);
    if(str) return JSON.parse(str);
    // 默认示例数据
    return [
        ["2026-09-01", 4, 7, 2, 6],
        ["2026-09-02", 6, 8, 3, 4],
        ["2026-09-03", 4, 5, 1, 5],
        ["2026-09-04", 5, 9, 4, 7],
        ["2026-09-05", 3, 6, 1, 5],
        ["2026-09-06", 7, 9, 4, 8],
        ["2026-09-07", 5, 8, 2, 6],
        ["2026-09-08", 6, 9, 3, 8],
        ["2026-09-09", 7, 9, 5, 6],
        ["2026-09-10", 6, 8, 3, 7],
        ["2026-09-11", 7, 10, 4, 9],
        ["2026-09-12", 9, 10, 5, 7],
        ["2026-09-13", 7, 9, 2, 5],
        ["2026-09-14", 5, 8, 1, 6],
        ["2026-09-15", 6, 9, 3, 8]
    ];
}
function saveLocal(arr){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

let emotionRecords = loadLocal();

// 模拟LSTM预测
function getPredict(records) {
    const lastDate = new Date(records[records.length - 1][0]);
    const pred = [];
    for(let i=1;i<=3;i++){
        const d = new Date(lastDate);
        d.setDate(d.getDate()+i);
        const ds = d.toISOString().slice(0,10);
        const val = Math.min(10, Math.max(0, 6 + Math.random()*3));
        pred.push([ds, Number(val.toFixed(1))]);
    }
    return pred;
}

// 渲染数据列表
function renderList(){
    const dom = document.getElementById("dataList");
    dom.innerHTML = "";
    emotionRecords.forEach((r, idx)=>{
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<span>${r[0]}｜O:${r[1]} H:${r[2]} L:${r[3]} C:${r[4]}</span>
        <button class="del" onclick="delItem(${idx})">删除</button>`;
        dom.appendChild(div);
    })
}

window.delItem = function(idx){
    emotionRecords.splice(idx,1);
    saveLocal(emotionRecords);
    renderList();
    renderChart();
}

// 绘制图表
function renderChart(){
    const raw = emotionRecords;
    const pred = getPredict(raw);

    const dates = raw.map(item=>item[0]);
    const predDates = pred.map(item=>item[0]);
    const allX = [...dates, ...predDates];

    // ECharts candle格式：[open, close, low, high]
    const candleData = raw.map(d => [d[1], d[4], d[3], d[2]]);

    const option = {
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross' }
        },
        legend: {
            data: ['情绪蜡烛K线', 'LSTM预测情绪'],
            top: 10
        },
        grid: { left: '8%', right: '5%', bottom: '12%' },
        xAxis: {
            type: 'category',
            data: allX,
            axisLabel: { rotate: 30 }
        },
        yAxis: {
            type: 'value',
            name: '情绪分值(0‑10)',
            min: 0,
            max: 10
        },
        series: [
            {
                name: '情绪蜡烛K线',
                type: 'candlestick',
                data: candleData,
                itemStyle: {
                    color: '#ff3b30',
                    color0: '#34c759',
                    borderColor: '#ff3b30',
                    borderColor0: '#34c759'
                }
            },
            {
                name: 'LSTM预测情绪',
                type: 'line',
                data: (()=>{
                    let arr = Array(raw.length).fill(null);
                    pred.forEach(p=>arr.push(p[1]));
                    return arr;
                })(),
                symbol: 'circle',
                symbolSize: 6,
                lineStyle:{color:'#ff8800',type:'dashed',width:2},
                itemStyle:{color:'#ff8800'}
            }
        ]
    };
    myChart.setOption(option);
}

// 添加记录
document.getElementById("btnAdd").onclick = ()=>{
    const date = document.getElementById("inDate").value;
    const o = parseFloat(document.getElementById("inOpen").value);
    const h = parseFloat(document.getElementById("inHigh").value);
    const l = parseFloat(document.getElementById("inLow").value);
    const c = parseFloat(document.getElementById("inClose").value);
    if(!date || isNaN(o)||isNaN(h)||isNaN(l)||isNaN(c)){
        alert("请填写完整数值，0‑10之间");
        return;
    }
    emotionRecords.push([date, o, h, l, c]);
    saveLocal(emotionRecords);
    renderList();
    renderChart();
}

document.getElementById("btnClear").onclick = ()=>{
    emotionRecords = [];
    saveLocal(emotionRecords);
    renderList();
    renderChart();
}

document.getElementById("btnRender").onclick = renderChart;

// 初始化
renderList();
renderChart();
window.addEventListener('resize',()=>myChart.resize());
</script>
</body>
</html>
