<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪日K线监测系统</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f7f9fc;
            color: #222;
            padding: 24px 16px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .wrap {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .input-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }
        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: repeat(2,1fr);
            }
        }
        .input-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-item label {
            font-size: 13px;
            color: #555;
        }
        input {
            padding: 9px 11px;
            border: 1px solid #dde1e8;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #4080ff;
        }
        .btn-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        button {
            padding: 9px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-submit {background:#4080ff; color:#fff;}
        .btn-predict {background:#00b42a; color:#fff;}
        .btn-export {background:#722ed1; color:#fff;}
        .btn-clear {background:#f53f3f; color:#fff;}
        button:disabled {opacity:0.4; cursor:default;}
        .tip-msg {
            padding:10px 12px;
            border-radius:6px;
            font-size:13px;
        }
        .loading {color:#4080ff; text-align:center;}
        .error {background:#fff2f2;color:#f53f3f;}
        .warn-card {
            padding:16px;
            border-radius:8px;
            margin-bottom:20px;
        }
        .warn-low {background:#fff2f2; border:1px solid #f53f3f; color:#c92c2c;}
        .warn-normal {background:#f0f7ff; border:1px solid #4080ff; color:#1d53d9;}
        .warn-high {background:#fff7e6; border:1px solid #ff7d00; color:#d46b08;}
        .warn-card h4 {
            font-size:15px;
            margin-bottom:8px;
        }
        .warn-card p {
            font-size:14px;
            margin:4px 0;
        }
        .chart-box {
            width:100%;
            height:480px;
            border-radius:8px;
            background:#fafbfd;
            margin-bottom:24px;
        }
        .history-title {
            font-size:16px;
            margin-bottom:10px;
        }
        .history-list {
            max-height:280px;
            overflow-y:auto;
            border:1px solid #eee;
            border-radius:8px;
        }
        .history-item {
            padding:10px 12px;
            border-bottom:1px solid #f3f4f6;
            font-size:14px;
        }
        .history-item:last-child {border-bottom:none;}
        .empty-tip {
            padding:20px;
            text-align:center;
            color:#999;
            font-size:13px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="wrap">
        <h1>情绪日K线监测系统</h1>
        <p class="desc">填写整数情绪数值(0‑10)：open开盘(起床)、close收盘(睡前)、low当日最低、high当日最高；数据保存在浏览器本地</p >

        <div class="input-group">
            <div class="input-item">
                <label>开盘 open(起床)</label>
                <input v-model.number="openVal" type="number" min="0" max="10" step="1" placeholder="0‑10整数">
            </div>
            <div class="input-item">
                <label>收盘 close(睡前)</label>
                <input v-model.number="closeVal" type="number" min="0" max="10" step="1" placeholder="0‑10整数">
            </div>
            <div class="input-item">
                <label>最低 low</label>
                <input v-model.number="lowVal" type="number" min="0" max="10" step="1" placeholder="0‑10整数">
            </div>
            <div class="input-item">
                <label>最高 high</label>
                <input v-model.number="highVal" type="number" min="0" max="10" step="1" placeholder="0‑10整数">
            </div>
        </div>

        <div class="btn-bar">
            <button class="btn-submit" @click="addRecord" :disabled="loading">提交今日K线记录</button>
            <button class="btn-predict" @click="doWarn" :disabled="loading || recordList.length < 3">情绪状态预警</button>
            <button class="btn-export" @click="exportChart">导出K线图PNG</button>
            <button class="btn-clear" @click="clearAll">清空全部记录</button>
        </div>

        <div v-if="loading" class="tip-msg loading">处理中...</div>
        <div v-if="errorMsg" class="tip-msg error">{{errorMsg}}</div>

        <div v-if="warnResult" :class="['warn-card', warnResult.cssClass]">
            <h4>🔔 情绪预警：{{warnResult.status}}</h4>
            <p>{{warnResult.tip}}</p >
            <p style="font-size:12px;opacity:0.8;margin-top:6px">基于历史情绪变化分析，仅供参考</p >
        </div>

        <div class="chart-box" ref="chartRef"></div>

        <h3 class="history-title">历史K线记录</h3>
        <div class="history-list">
            <div class="history-item" v-for="r in recordList" :key="r.id">
                <div>日期：{{r.date}}</div>
                <div>open:{{r.open}} | close:{{r.close}} | low:{{r.low}} | high:{{r.high}}</div>
            </div>
            <div v-if="recordList.length===0" class="empty-tip">暂无记录，请输入4个整数提交</div>
        </div>
    </div>
</div>

<script>
const {createApp, ref, onMounted, onUnmounted, nextTick} = Vue;

createApp({
    setup(){
        const openVal = ref(null);
        const closeVal = ref(null);
        const lowVal = ref(null);
        const highVal = ref(null);
        const recordList = ref([]);
        const klineData = ref([]);
        const loading = ref(false);
        const errorMsg = ref("");
        const warnResult = ref(null);
        const chartRef = ref(null);
        let myChart = null;

        // 渲染图表，必须等DOM就绪
        function renderChart(){
            if(!myChart) return;
            const option = {
                title:{text:"情绪日K线图",left:"center"},
                tooltip:{
                    trigger:"axis",
                    formatter: function(params){
                        const d = params[0].data;
                        return `日期：${d[0]}<br/>开盘(起床):${d[1]}<br/>收盘(睡前):${d[2]}<br/>最低:${d[3]}<br/>最高:${d[4]}`;
                    }
                },
                xAxis:{type:"category",data:klineData.value.map(i=>i[0]),axisLabel:{rotate:30}},
                yAxis:{type:"value",min:0,max:10,name:"情绪得分(0消极~10积极)"},
                series:[{
                    name:"情绪K线",
                    type:"candlestick",
                    data:klineData.value,
                    itemStyle:{color:"#00b42a",color0:"#f53f3f"}
                }]
            };
            myChart.setOption(option);
        }

        function rebuildKline(){
            const arr = [];
            for(let r of recordList.value){
                arr.push([r.date, r.open, r.close, r.low, r.high]);
            }
            klineData.value = arr;
            // 关键：nextTick等待DOM更新完毕再画图
            nextTick(()=>{
                renderChart();
            })
        }

        function loadFromStorage(){
            const raw = localStorage.getItem("emotion_kline_records");
            if(raw){
                recordList.value = JSON.parse(raw);
            }
            rebuildKline();
        }

        function saveToStorage(){
            localStorage.setItem("emotion_kline_records", JSON.stringify(recordList.value));
        }

        // 情绪预警分析：只输出状态文本，不预测K线数值
        function emotionWarn(records){
            const closes = records.map(x=>x.close);
            const avg = closes.reduce((s,v)=>s+v,0)/closes.length;
            const last = closes[closes.length-1];
            const trend = last - closes[closes.length-2];

            let status, tip, cssClass;
            if(avg <= 3){
                status = "低迷状态";
                tip = "近期情绪整体偏低，建议多休息，减少内耗，必要时寻求倾诉。";
                cssClass = "warn-low";
            }else if(avg >=7){
                status = "亢奋状态";
                tip = "情绪处于高位，容易冲动疲惫，注意控制压力，避免过度消耗。";
                cssClass = "warn-high";
            }else{
                status = "平稳状态";
                tip = "情绪波动适中，整体状态稳定，继续保持即可。";
                cssClass = "warn-normal";
            }
            // 叠加趋势提示
            if(trend < -2){
                tip += " 注意：近期情绪有明显下滑趋势。";
            }else if(trend > 2){
                tip += " 注意：近期情绪有明显抬升趋势。";
            }
            return {status,tip,cssClass};
        }

        const addRecord = async ()=>{
            if(openVal.value===null || closeVal.value===null || lowVal.value===null || highVal.value===null){
                errorMsg.value="请完整填写open、close、low、high四个整数";
                return;
            }
            const o = Number(openVal.value);
            const c = Number(closeVal.value);
            const l = Number(lowVal.value);
            const h = Number(highVal.value);
            if(l>o || l>c || h<o || h<c){
                errorMsg.value="校验错误：low必须≤open/close；high必须≥open/close";
                return;
            }
            loading.value=true;
            errorMsg.value="";
            const today = new Date().toLocaleDateString("zh‑CN");
            const newRec = {
                id:Date.now(),
                date: today,
                open: o,
                close: c,
                low: l,
                high: h
            };
            recordList.value.push(newRec);
            saveToStorage();
            rebuildKline();
            openVal.value=null;
            closeVal.value=null;
            lowVal.value=null;
            highVal.value=null;
            warnResult.value=null;
            loading.value=false;
        }

        const doWarn = ()=>{
            loading.value=true;
            errorMsg.value="";
            try{
                const res = emotionWarn(recordList.value);
                warnResult.value = res;
            }catch(e){
                errorMsg.value = "预警分析失败：" + e.message;
            }finally{
                loading.value=false;
            }
        }

        const clearAll = ()=>{
            localStorage.removeItem("emotion_kline_records");
            recordList.value=[];
            klineData.value=[];
            warnResult.value=null;
            rebuildKline();
        }

        const exportChart = ()=>{
            const url = myChart.getDataURL({type:"png",pixelRatio:2});
            const a = document.createElement("a");
            a.href=url;
            a.download="情绪日K线.png";
            a.click();
        }

        onMounted(()=>{
            myChart = echarts.init(chartRef.value);
            loadFromStorage();
            window.addEventListener('resize',()=>myChart?.resize());
        })
        onUnmounted(()=>{
            myChart?.dispose();
        })

        return {
            openVal,closeVal,lowVal,highVal,
            recordList, klineData, loading, errorMsg, warnResult, chartRef,
            addRecord, doWarn, clearAll, exportChart
        }
    }
}).mount("#app");
</script>
</body>
</html>
